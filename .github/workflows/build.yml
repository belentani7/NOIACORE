name: Validate NOIACORE / NOIA and API security
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-noia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate HTML and isolation constraints
        run: python3 src/main/resources/static/noia/test_noia.py
      - name: Validate embedded JavaScript syntax
        run: node --check src/main/resources/static/noia/inline-ci.js
  verify-java-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify API security and regression tests
        run: mvn --batch-mode --no-transfer-progress verify
