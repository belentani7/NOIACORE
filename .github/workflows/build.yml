name: Validate NOIACORE / NOIA
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate-noia:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate HTML and isolation constraints
        run: python3 src/main/resources/static/noia/test_noia.py
      - name: Validate embedded JavaScript syntax
        run: node --check src/main/resources/static/noia/inline-ci.js
