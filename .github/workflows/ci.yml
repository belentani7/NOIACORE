name: CI — NOIACORE Spring Boot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noiacore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-verify:
    name: Maven verify (native backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Maven wrapper
        run: test -f mvnw && test -f pom.xml
      - name: Compile and run actual tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify

  black-water-static:
    name: NAVE browser-state and SEO regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate NAVE JavaScript syntax
        run: |
          node --check black-water/assets/js/nave.js
          node --check black-water/assets/data/content.js
      - name: Run Black Water functional and metadata tests
        run: node --test black-water/tests/*.test.cjs
