name: CI — NOIACORE Spring Boot

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noiacore-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-verify:
    name: Maven verify (native backend)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify Maven wrapper
        run: test -f mvnw && test -f pom.xml
      - name: Compile and run actual tests
        run: bash ./mvnw --batch-mode --no-transfer-progress verify
