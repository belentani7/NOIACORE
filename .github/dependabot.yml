version: 2
updates:
  # npm en la raíz se retiró: no hay package.json en la raíz (el proyecto raíz es
  # Maven/Java) y provocaba "Error during file fetching: /package.json not found".
  - package-ecosystem: "npm"
    directory: "/black-water"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
    labels:
      - "dependencies"
      - "github-actions"
