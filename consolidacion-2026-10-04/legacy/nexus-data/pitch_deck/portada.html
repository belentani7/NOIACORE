<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<style>
*{box-sizing:border-box}
body{margin:0}
.slide-container{width:1280px;min-height:720px;background:#EBF4FF;color:#0A2540;font-family:Arial,Helvetica,sans-serif;display:grid;grid-template-columns:2fr 1fr;gap:36px;padding:64px 82px 0}
.eyebrow{font-size:22px;letter-spacing:4px;font-weight:800;color:#DD6B20}
.title{font-size:112px;line-height:.92;font-weight:800;letter-spacing:-6px;margin-top:34px}
.subtitle{font-size:30px;line-height:1.25;color:#1E3A8A;font-weight:500;max-width:720px;margin-top:24px}
.footer{align-self:end;padding-bottom:32px;font-size:18px;color:#1E3A8A}
.accent{background:#DD6B20;min-height:480px;padding:28px 24px;display:flex;align-items:flex-end;color:#EBF4FF;font-size:48px;line-height:1.02;font-weight:800}
</style>
</head>
<body>
<div class="slide-container">
  <main>
    <div class="eyebrow">NEXUS DATA / 01</div>
    <div class="title">De datos<br>dispersos a<br>decisiones.</div>
    <div class="subtitle">Inteligencia vertical para el mercado de talento tecnológico remoto.</div>
    <div class="footer">Pitch comercial · Europa + Latinoamérica · Agosto 2026</div>
  </main>
  <aside class="accent">El scraping es infraestructura.<br><br>La inteligencia es el producto.</aside>
</div>
</body>
</html>
