[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[project]
name = "noiacore-aurea-x"
version = "2.0.0"
description = "NoiaCore + AUREA X: Production-ready autonomous enterprise system"
authors = [{name = "AUREA X", email = "ops@aurea-x.io"}]
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "fastapi==0.104.1",
    "uvicorn[standard]==0.24.0",
    "sqlalchemy[asyncio]==2.0.23",
    "asyncpg==0.29.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "stripe==7.0.0",
    "python-dotenv==1.0.0",
    "httpx==0.25.0",
    "openai==1.3.6",
    "numpy==1.26.2",
    "structlog==23.2.0",
    "python-json-logger==2.0.7",
    "alembic==1.12.1",
    "prometheus-client==0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "black==23.11.0",
    "isort==5.13.2",
    "mypy==1.7.1",
    "flake8==6.1.0",
    "pylint==3.0.3",
    "pre-commit==3.5.0",
]

test = [
    "pytest==7.4.3",
    "pytest-asyncio==0.21.1",
    "pytest-cov==4.1.0",
    "httpx==0.25.0",
]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
