services:
  mysql:
    image: mysql:8.4
    container_name: aion_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aion_workforce}
      MYSQL_USER: ${MYSQL_USER:-aion_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
    ports:
      - "3306:3306"
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -u root --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  app:
    image: node:22-bookworm-slim
    container_name: aion_app
    working_dir: /app
    env_file:
      - .env
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: mysql://${MYSQL_USER:-aion_user}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-aion_workforce}
      DB_POOL_MAX: 10
    command: >-
      sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm build && pnpm start"
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysqldata:
  app_node_modules:
